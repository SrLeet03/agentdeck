name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    # The formula lives in this repo (Formula/agentdeck.rb), so `brew tap SrLeet03/agentdeck <this repo>` works.
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Write formula for ${{ github.ref_name }}
        run: ./scripts/update-formula.sh "${{ github.ref_name }}"
      - name: Commit formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/agentdeck.rb
          git diff --cached --quiet && exit 0
          git commit -m "chore: update Homebrew formula to ${{ github.ref_name }}"
          git push origin HEAD:main
